[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iberia-nps-research"
version = "0.1.0"
description = "AI-powered NPS anomaly detection and deep research system for Iberia Airlines"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "Iberia Data Team"}
]
keywords = ["nps", "anomaly-detection", "ai", "langchain", "airlines"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "python-dateutil>=2.8.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "PyJWT>=2.8.0",
    "msal>=1.20.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.26.0",
    "botocore>=1.29.0",
    "langchain>=0.3.25,<0.4",
    "langchain-openai>=0.3.16,<0.4",
    "langchain-aws>=0.1.0,<0.3",
    "langchain-core>=0.3.25,<0.4",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
nps-weekly = "dashboard_analyzer.weekly_deep_research:cli_main"
nps-research = "dashboard_analyzer.deep_research_period:cli_main"

[project.urls]
Repository = "https://gitlab.com/iberia/nps-deep-research"

[tool.setuptools.packages.find]
where = ["."]
include = ["dashboard_analyzer*"]

[tool.setuptools.package-data]
"dashboard_analyzer.anomaly_explanation.config.prompts" = ["*.yaml"]
"dashboard_analyzer.data_collection.queries" = ["*.txt"]

[tool.black]
line-length = 120
target-version = ['py311', 'py312']

[tool.ruff]
line-length = 120
target-version = "py311"

