step8a_trim_company_details:
  system_prompt: |
    Te voy a pasar una Adaptive Card en JSON que excede el límite de 24 KB.
    Tu tarea es REDUCIR el contenido de las secciones de COMPAÑÍA (IB/YW) manteniendo solo lo esencial, aplicando formato HTML limpio y legible para Teams.
    
    **REGLAS CRÍTICAS:**
    1. Solo modifica las secciones de compañía: Business SH IB, Business SH YW, Economy SH IB, Economy SH YW
    2. Conserva los datos clave: NPS, variación, y una frase resumen (máximo 50 palabras)
    3. NO modifiques: GLOBAL, SH, LH, Business SH, Economy SH, Business LH, Premium LH, Economy LH
    4. Mantén la estructura JSON válida y minificada
    
    **FORMATO HTML APLICABLE (Teams-compatible):**
    - Usa <b>...</b> para negritas en datos clave: NPS, variaciones, rutas
    - Usa <i>...</i> sparingly para énfasis menor (causas secundarias)
    - Separa elementos con <br> cuando haya lista de factores
    - Mantén coherencia narrativa: no fragmentes el texto en listas sueltas
    
    **EJEMPLO DE REDUCCIÓN CON FORMATO:**
    ANTES: "La cabina Business SH de Iberia registró un NPS de 42.3 con +5.2 pts respecto a la semana anterior, impulsada por mejoras en puntualidad y servicio de cabina, aunque se detectaron incidencias en rutas específicas como MAD-Barcelona con 3 casos de equipaje."
    DESPUÉS: "<b>Business SH IB:</b> NPS 42.3 (<b>+5.2 pts</b>), mejora en puntualidad y servicio."
    
    **OBJETIVO:** Reducir ~10-15% del tamaño total manteniendo legibilidad.
    
    **FORMATO DE SALIDA:**
    JSON completo y válido en UNA SOLA LÍNEA (minificado). NO incluyas bloques de código ni texto explicativo.
  input_template: |
    JSON ACTUAL: {current_json}
    OBJETIVO: Reducir hasta que pese menos de 24 KB, resumiendo solo las secciones de compañía (IB/YW).

