ms":[{"type":"TextBlock","text":"[NPS]","horizontalAlignment":"Center"}]},{"type":"Column","width":"60px","items":[{"type":"TextBlock","text":"[Var]","horizontalAlignment":"Right","color":"[Good/Attention]"}]}]} ...[Resto de segmentos: Business SH IB, Business SH YW, Economy SH, Economy SH IB, Economy SH YW, Business LH, Premium LH, Economy LH]...]}],"actions":[{"type":"Action.ShowCard","title":"🌐 GLOBAL","card":{"type":"AdaptiveCard","body":[{"type":"TextBlock","text":"Análisis: GLOBAL","weight":"Bolder","color":"Accent"},{"type":"TextBlock","text":"[ANÁLISIS COMPLETO DEL PERÍODO]","wrap":true}],"version":"1.5"}},{"type":"Action.ShowCard","title":"✈️ SH","card":{"type":"AdaptiveCard","body":[{"type":"TextBlock","text":"Análisis: SH","weight":"Bolder","color":"Accent"},{"type":"TextBlock","text":"[ANÁLISIS COMPLETO DEL PERÍODO]","wrap":true}],"version":"1.5"}},{"type":"Action.ShowCard","title":"🌍 LH","card":{"type":"AdaptiveCard","body":[{"type":"TextBlock","text":"Análisis: LH","weight":"Bolder","color":"Accent"},{"type":"TextBlock","text":"[ANÁLISIS COMPLETO DEL PERÍODO]","wrap":true}],"version":"1.5"}},{"type":"Action.ShowCard","title":"✈️ Business SH","card":{"type":"AdaptiveCard","body":[{"type":"TextBlock","text":"Análisis: Business SH","weight":"Bolder","color":"Accent"},{"type":"TextBlock","text":"[ANÁLISIS COMPLETO DEL PERÍODO]","wrap":true}],"version":"1.5"}} ...[Resto de secciones con el mismo patrón simplificado]...]}
    
    **NOTA IMPORTANTE:** Esta estructura es GENÉRICA y funciona para cualquier período (semanal, diario, etc.). Cada botón contiene el análisis COMPLETO del período para ese segmento.

    **REGLA DE FUENTE:**
    - La síntesis ejecutiva trae secciones con títulos. Usa EXACTAMENTE esos títulos como fuente, salvo si vienen con Short Haul o Long Haul, en cuyo caso usa SH o LH respectivamente.
    - Si una sección no existe en la síntesis, NO inventes contenido para ella.
    - 🎯 **FOCUS TOUCHPOINT (cuando aplique):** Si en la síntesis aparece información de un FOCUS TOUCHPOINT (marcado con 🎯), añade una acción `Action.ShowCard` con título "🎯 FOCUS: {nombre_touchpoint}" que incluya las tres subsecciones: (1) CSAT por segmento (CSAT actual, gap vs target, satisfaction diff si modo comparative), (2) verbatims del focus touchpoint por segmento (resumen, top positivos, top negativos; indicar ausencia si no hay datos), (3) % issues por segmento (Pct_Issues L7D y variación vs L7D_prev; indicar ausencia si no hay datos o no existe mapeo). Esta tarjeta es OBLIGATORIA cuando el dato está presente y DEBE ir PRIMERA en la lista de botones, ANTES que GLOBAL.
    
    **ORDEN DE SECCIONES EN LOS BOTONES (respetar estrictamente):**
    1. 🎯 FOCUS: {touchpoint} (si aplica - PRIMERO)
    2. 🌐 GLOBAL
    3. ✈️ SH (y subsegmentos)
    4. 🌍 LH (y subsegmentos)
    
    El Focus Touchpoint SIEMPRE debe ser el primer botón cuando esté presente.

    **REGLAS DE TABLA:**
    - **ICONOS OBLIGATORIOS:**
      - GLOBAL: 🌐
      - SH: ✈️ (y todos sus subsegmentos)
      - LH: 🌍 (y todos sus subsegmentos)
      - NO USES otros iconos.
    - SIN INDENTACIÓN (lista plana de segmentos).
    - Colores: `Good` para (+) y `Attention` para (-).
    
    **REGLAS DE NOMENCLATURA (CRÍTICO):**
    - 🚫 NUNCA uses "Short Haul" o "Long Haul" en la Adaptive Card.
    - ✅ USA SIEMPRE "SH" para Short Haul y "LH" para Long Haul.
    - Esto aplica a TODOS los textos, títulos, y contenido de la tarjeta.

    **REGLAS TÉCNICAS:**
    - Devuelve SOLO el JSON minificado en una sola línea.
    - NO incluyas bloques de código markdown ni texto explicativo.
    - Escapa las comillas internas si es necesario para que sea un string JSON válido.

  input_template: |
