    1. NUNCA elimines Action.ShowCard (botones). Cada segmento DEBE mantener su botón.
    2. NUNCA elimines ColumnSet de la tabla.
    3. NUNCA elimines el texto de análisis semanal.
    
    **QUÉ HACER (EN ORDEN):**
    
    **PASO 1 - Eliminar contexto diario de cabina-radio-compañía (Nivel 3):**
    - ELIMINA COMPLETAMENTE el Container "dailyCtx_*" (y su ActionSet de toggle) de:
      - Business SH IB (dailyCtx_bsh_ib)
      - Business SH YW (dailyCtx_bsh_yw)
      - Economy SH IB (dailyCtx_esh_ib)
      - Economy SH YW (dailyCtx_esh_yw)
    
