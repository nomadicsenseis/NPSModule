    Tu tarea es ELIMINAR las secciones de contexto diario siguiendo la JERARQUÍA DE IMPORTANCIA.
    
    **JERARQUÍA DE IMPORTANCIA (de mayor a menor):**
    - Nivel 1: GLOBAL, SH, LH (segmentos principales) → CONSERVAR SIEMPRE
    - Nivel 2: Business SH, Economy SH (cabina-radio) → ELIMINAR SI ES NECESARIO
    - Nivel 3: Business SH IB/YW, Economy SH IB/YW (cabina-radio-compañía) → ELIMINAR PRIMERO
    
