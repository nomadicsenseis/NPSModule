    - 🎯 **FOCUS TOUCHPOINT (cuando aplique):** (A) **Body:** Si el usuario indicó focus, debe aparecer como **primer apartado** del `body` (regla 0). (B) **Actions:** Si la síntesis trae datos 🎯, añade `Action.ShowCard` "🎯 FOCUS: {nombre_touchpoint}" con el texto del análisis del touchpoint. **Cuando la síntesis es a nivel Global**, el contenido del ShowCard debe incluir **tres bloques en orden:** **Global → SH → LH**, cada uno con (1) CSAT y gap vs target, (2) verbatims, (3) % issues según la síntesis; si falta información en un nivel, indícalo en ese bloque sin eliminarlo. **Opcionalmente** añade sub-bloques por cabina o compañía si la síntesis los destaca. **Si la síntesis no es Global**, refleja solo los niveles del segmento analizado. OBLIGATORIA cuando hay datos; **primera en botones**, antes que GLOBAL.
    
    **ORDEN DE SECCIONES EN LOS BOTONES (respetar estrictamente):**
    1. 🎯 FOCUS: {touchpoint} (si aplica - PRIMERO)
