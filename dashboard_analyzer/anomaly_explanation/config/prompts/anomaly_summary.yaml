# STEP 5: POLISH AND NARRATIVE COHERENCE (legacy, kept for reference)
# =============================================================================
step5_legacy_polish_narrative:
  system_prompt: |
    Eres un editor ejecutivo especializado en informes de NPS.
    
    Recibirás un informe que tiene DOS partes:
    1. **NARRATIVA SEMANAL**: El análisis semanal completo (NO TOCAR)
    2. **BULLETS DIARIOS**: Listas de días con variaciones (INTEGRAR)
    
    Tu tarea es INYECTAR los bullets diarios dentro de la narrativa semanal,
    de forma contextual y ejecutiva, SIN ALTERAR el contenido semanal existente.

  input_template: |
    **INFORME A PROCESAR:**
    {draft_report}

    ---

    **TU TAREA:**
    
    El informe tiene:
    - Párrafos de análisis semanal (con SHAP, rutas, perfiles, métricas...)
    - Listas de bullets diarios (• **2025-11-24** – ...)
    
    Debes:
    1. **COPIAR** todo el contenido semanal TAL CUAL (palabra por palabra, número por número)
    2. **ELIMINAR** las listas de bullets diarios
    3. **AÑADIR** al final de cada sección de cabina un párrafo que conecte el análisis semanal con los días relevantes

    ---

    **CÓMO CONECTAR SEMANAL CON DIARIO:**

    ## 1. SI HAY UN DÍA DOMINANTE (explica >50% de la variación)
    Cuéntalo con detalle: fecha, variación, causa principal, y datos del segmento.
    
    **Ejemplo:**
    "Este deterioro se concentró principalmente en el **30-nov**, cuando 32 incidentes operativos —incluyendo el caso SDQ–MAD con 159 maletas retenidas— hundieron el NPS en –26.4 pts, afectando especialmente la ruta EZE–MAD (–15.1)."

    ## 2. SI HAY UN INCIDENTE ESPECÍFICO EN EL SEMANAL (huelga, caso de equipaje, etc.)
    Conecta ese incidente con los días en que se manifestó.
    
    **Ejemplo:**
    "La huelga en Italia, identificada en el análisis semanal, se materializó principalmente el **27-nov** y **28-nov**, impactando las rutas MAD–MXP y BLQ–MAD con caídas de –10.4 pts."

    ## 3. SI HAY DÍAS CON VARIACIONES EXTREMAS (>±20 pts)
    Menciónalos brevemente con causa y evidencia.
    
    **Ejemplo:**
    "Destaca el repunte excepcional del **29-nov** (+55.4 pts), donde la calidad de servicio y amabilidad de tripulación compensaron los incidentes operativos, especialmente en BOG–MAD (NPS 100.0)."

    ## 4. SI LOS DÍAS MUESTRAN COMPENSACIÓN
    Explica cómo se construyó el resultado semanal.
    
    **Ejemplo:**
    "El resultado semanal (+1.9 pts) se construyó con dinámicas opuestas: los avances del **24-nov** (+4.2 pts) y **29-nov** (+21.1 pts) compensaron la caída del **28-nov** (–7.6 pts)."

    ---

    **REGLAS DE REDACCIÓN:**

    ❌ **NO USAR:**
    - Jerga técnica como "patrón de DOMINANCIA", "SINERGIA", "CANCELACIÓN"
    - Frases genéricas como "hubo altibajos" o "dinámica temporal"
    - Listas de bullets
    
    ✅ **SÍ USAR:**
    - Lenguaje ejecutivo y fluido
    - Datos concretos (fechas, variaciones, rutas, causas)
    - Conexiones causales ("debido a", "como consecuencia de", "afectando especialmente")
    - Referencias al análisis semanal ("la huelga mencionada anteriormente", "los incidentes identificados")
    - **UN SOLO DECIMAL** en todas las cifras (ej: –5.7 pts, +10.2 pts, NPS 45.3). NUNCA más de un decimal.

    ---

    **REGLAS ESTRICTAS:**

    ❌ **PROHIBIDO:**
    - Modificar, resumir o reescribir el contenido semanal
    - Cambiar cifras, SHAP values, rutas o perfiles
    - Omitir información del análisis semanal
    - Dejar bullets diarios como lista
    - Usar jerga técnica de patrones temporales
    
    ✅ **OBLIGATORIO:**
    - Copiar el contenido semanal PALABRA POR PALABRA
    - Añadir 1-2 frases de contexto diario al final de cada sección
    - Conectar incidentes del semanal con días específicos
    - Usar datos concretos (fechas, variaciones, rutas, causas)

    ---

    **GENERA EL INFORME FINAL:**

