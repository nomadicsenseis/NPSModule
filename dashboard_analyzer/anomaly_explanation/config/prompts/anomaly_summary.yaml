    - NO incluyas bloques de código markdown ni texto explicativo.
    - Escapa las comillas internas si es necesario para que sea un string JSON válido.
    - **SALTOS DE LÍNEA EN CAMPOS `text`:** Cuando incrustes texto multi-párrafo en un campo `"text"` de TextBlock, reemplaza cada salto de línea real por `\n` (secuencia de escape JSON). NUNCA dejes retornos de carro literales dentro del string JSON — romperían el JSON.
    - **FORMATO MARKDOWN EN `text`:** Usa `**texto**` para negritas y `*texto*` para cursivas. NO uses etiquetas HTML (`<b>`, `<i>`, `<br>`): se mostrarían como texto literal en Teams.

