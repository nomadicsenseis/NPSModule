    **RESPONDE SOLO CON EL NOMBRE DE LA HERRAMIENTA** (ej: operative_data_tool)

# =============================================================================
# SYNTHESIS PROMPTS
# =============================================================================
final_synthesis_prompt: |
  **GENERA UN INFORME CAUSAL CONSOLIDADO** basado en los datos recolectados durante la investigación.

  ⚠️ **INSTRUCCIONES CRÍTICAS PARA LA COMPARATIVA:**
  - En la sección "INFORMACIÓN DE COMPARACIÓN" encontrarás la descripción exacta del período de referencia.
  - COPIA LITERALMENTE esa descripción en el informe final.
  - FORMATO OBLIGATORIO: "NPS de referencia ({descripción_exacta_del_período_de_referencia}): {valor}"
  - NUNCA uses el término "baseline" a secas. Especifica siempre contra qué comparas.

  📋 **ESTRUCTURA DEL INFORME:**
  1. **Resumen del cambio de NPS** - Incluye NPS actual, valor de referencia y variación
  2. **Causa/s encontradas y Triangulación** - Explicación detallada de las causas. **ES OBLIGATORIO CITAR LOS DATOS CUANTITATIVOS** de cada fuente:
     - **Drivers**: Menciona el valor SHAP exacto (ej: -2.4 ppts).
     - **NCS**: Menciona el número de incidentes por tipo (ej: +12 cancelaciones).
     - **Verbatims**: Menciona el volumen de comentarios o ejemplos representativos con su NPS.
     - **Operativa**: Cita valores de OTP, Load Factor o Mishandling respecto al período de referencia.
     **INDICA EXPLÍCITAMENTE** el nivel de confianza basado en la triangulación.
  3. **🐴 Dark horses detectados** - Eventos excepcionales identificados en NCS (huelgas, meteorología, fallos sistemas, etc.)
     - Si se detectaron en el período ACTUAL: explica cómo afectaron al NPS actual
     - Si se detectaron en el período de COMPARACIÓN: indica que los datos de referencia estaban afectados por estos eventos
     - Si no hubo dark horses: indicar "No se detectaron eventos excepcionales"
  4. **Rutas afectadas** - Rutas con mayor impacto. Resalta aquellas donde coincidan incidentes NCS y quejas en Verbatims.
     ⚠️ **MUESTRA INSUFICIENTE**: Rutas con <5 encuestas deben marcarse como "muestra insuficiente" y NO citarse como evidencia primaria.
  5. **Reactividad de cliente** - Perfiles más afectados
  6. **🎯 ANÁLISIS DE FOCUS TOUCHPOINT** (incluir SOLO si hay un touchpoint marcado con 🎯 FOCUS en los datos):
     - CSAT del período y diferencia vs referencia (en puntos, no %)
     - Rutas con peor CSAT para este touchpoint (solo rutas con ≥5 encuestas)
     - Verbatims representativos filtrados por este touchpoint — usa los datos de la sección "🎯 FOCUS TOUCHPOINT ENRICHMENT DATA" en los datos recolectados. Esa sección contiene verbatims específicos del touchpoint y el % de issues. DEBES citarlos explícitamente con ejemplos concretos.
     - % de issues del touchpoint en el período actual vs período de comparación (si disponible en FOCUS TOUCHPOINT ENRICHMENT DATA)
     - Conclusión: ¿Es driver principal o factor secundario de la anomalía?
     ⚠️ Si NCS devolvió 0 incidentes, NO atribuyas rutas a NCS. Las rutas en routes_tool provienen de otra fuente (triangulación de datos), no de incidentes NCS directos.

# =============================================================================
# FOCUS TOUCHPOINT PROMPT (appended to system prompt when focus_touchpoint is active)
# =============================================================================
focus_touchpoint_prompt: |
  🎯 **FOCUS TOUCHPOINT ACTIVO: {focus_touchpoint}**

  Tienes un touchpoint de foco específico para esta investigación. Esto cambia tu metodología:

  **PRIORIDADES ADICIONALES (en orden):**
  1. **ANCLA PRINCIPAL**: Trata "{focus_touchpoint}" como un eje de investigación PRIMARIO, al mismo nivel que la anomalía de NPS global.
  2. **CSAT OBLIGATORIO**: Cuando explanatory_drivers_tool devuelva datos, busca la fila marcada con "🎯 FOCUS: {focus_touchpoint}". Verás DOS métricas distintas — úsalas correctamente y NO las mezcles:
     - **Sat_diff**: diferencia de satisfacción vs el período comparativo (mismo eje que los otros drivers SHAP).
     - **CSAT vs target**: CSAT absoluto comparado contra el objetivo (target). Escala diferente — cítalo como "CSAT={valor}, diff vs target={diff} pts".
  3. **RUTAS PRIORITARIAS**: En routes_tool, prioriza las rutas con peor CSAT para "{focus_touchpoint}" sobre las rutas con peor NPS global. Estas rutas son tu hipótesis principal.
  4. **VERBATIMS DEDICADOS**: La sección de verbatims filtrados por "{focus_touchpoint}" debe analizarse SEPARADAMENTE del análisis general de verbatims. Identifica los temas recurrentes específicos de este touchpoint.
  5. **SECCIÓN DEDICADA EN INFORME**: El informe final DEBE incluir una sección "🎯 ANÁLISIS DE {focus_touchpoint}" con: CSAT, rutas peor CSAT (≥5 pax), verbatims representativos, y conclusión sobre si es driver principal o secundario.

  **REGLAS DE MUESTRA:**
  ▸ Rutas con <5 encuestas: márcalas como "muestra insuficiente" — pueden mencionarse como señal débil pero NO como evidencia primaria.
  ▸ Rutas con 5-20 encuestas: menciona la limitación estadística.

  **REGLA NCS vs RUTAS:**
  ▸ Si NCS devuelve 0 incidentes, NO atribuyas las rutas que aparecen en routes_tool a NCS. Las rutas en routes_tool provienen de la triangulación de datos de NPS/CSAT, no de incidentes NCS directos.
