initial_decision_prompts:
  comparative: |
    **DECISIÓN INICIAL - MODO COMPARATIVE**

    🎯 **CONTEXTO**: Estás iniciando una investigación de anomalía NPS en modo comparativo.

    **OBJETIVO**: Decidir qué herramienta ejecutar PRIMERO basándote en la metodología del flujo de trabajo.

    **METODOLOGÍA**: El flujo completo es: `explanatory_drivers_tool` → `operative_data_tool` → `verbatims_tool` (1) → `ncs_tool` → `verbatims_tool` (2) → `routes_tool` → `customer_profile_tool`.

    **DECISIÓN**: ¿Qué herramienta ejecutar PRIMERO?

    **RESPONDE SOLO CON EL NOMBRE DE LA HERRAMIENTA** (ej: explanatory_drivers_tool)

    single: |
    **DECISIÓN INICIAL - MODO SINGLE**

    🎯 **CONTEXTO**: Estás iniciando una investigación de anomalía NPS en modo single (período único).

    **OBJETIVO**: Decidir qué herramienta ejecutar PRIMERO basándote en la metodología del flujo de trabajo.

    **METODOLOGÍA**: El flujo completo es: `operative_data_tool` → `ncs_tool` → `verbatims_tool` → `routes_tool` → `customer_profile_tool`.

    **DECISIÓN**: ¿Qué herramienta ejecutar PRIMERO?

    **RESPONDE SOLO CON EL NOMBRE DE LA HERRAMIENTA** (ej: operative_data_tool)

# =============================================================================
# SYNTHESIS PROMPTS
# =============================================================================
final_synthesis_prompt: |
  **GENERA UN INFORME CAUSAL CONSOLIDADO** basado en los datos recolectados durante la investigación.

  ⚠️ **INSTRUCCIONES CRÍTICAS PARA EL BASELINE:**
  - En la sección "INFORMACIÓN DE BASELINE" encontrarás la descripción exacta del baseline
  - COPIA LITERALMENTE esa descripción en el informe final
  - FORMATO OBLIGATORIO: "NPS Baseline ({descripción_exacta_del_baseline}): {valor}"

  📋 **ESTRUCTURA DEL INFORME:**
  1. **Resumen de la anomalía** - Incluye NPS actual, baseline y variación
  2. **Causa/s encontradas y herramientas que la validan** - Explicacion de las causas encontradas y las herramientas que la validan
  3. **Rutas afectadas** - Rutas con mayor impacto
  4. **Reactividad de cliente** - Perfiles más afectados
